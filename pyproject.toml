[project]
name = "merjack"
version = "0.1.0"
description = "Merjack — agentic business-acquisition deal finder & rater"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "httpx>=0.27",          # SearXNG search client (merjack/search)
]

[project.optional-dependencies]
# Agent runtime + live browser sourcing (needed from M3 onward)
agent = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-anthropic>=0.2",
    "langchain-openai>=0.2",          # also used for OpenRouter (OpenAI-compatible API)
    "langchain-mcp-adapters>=0.1",
    "langgraph-checkpoint-sqlite>=2.0",
]
# Local UI (M3+)
ui = [
    "streamlit>=1.36",
]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["merjack*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
